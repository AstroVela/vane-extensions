<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="The public registry of Vane extension provider packages.">
    <title>Vane extensions</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
        line-height: 1.5;
      }
      body {
        margin: 0 auto;
        max-width: 70rem;
        padding: 3rem 1.25rem;
      }
      header {
        margin-bottom: 2.5rem;
      }
      h1 {
        font-size: clamp(2rem, 7vw, 4rem);
        letter-spacing: -0.05em;
        margin: 0;
      }
      header p {
        font-size: 1.15rem;
        max-width: 52rem;
      }
      #extensions {
        display: grid;
        gap: 1rem;
        grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
      }
      article {
        border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
        border-radius: 0.8rem;
        padding: 1.25rem;
      }
      article h2 {
        margin: 0;
      }
      code {
        overflow-wrap: anywhere;
      }
      .title-row {
        align-items: baseline;
        display: flex;
        gap: 0.75rem;
        justify-content: space-between;
      }
      .meta {
        opacity: 0.75;
      }
      .facts {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem 1rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Vane extensions</h1>
      <p>
        Discover independently published provider packages for Vane. Install a
        package with pip, then load its provider explicitly from Vane.
      </p>
      <p>
        <a href="v1/index.json">Discovery catalog</a> ·
        <a href="v1/extensions/index.json">Extension details</a> ·
        <a href="v1/metrics/downloads-last-week.json">Download metrics</a> ·
        <a href="https://github.com/AstroVela/vane-extensions">Contribute an extension</a>
      </p>
    </header>
    <main>
      <p id="status" role="status" aria-live="polite">Loading the extension catalog…</p>
      <section id="extensions"></section>
    </main>
    <script>
      const status = document.querySelector("#status");
      const extensions = document.querySelector("#extensions");

      fetch("v1/extensions/index.json", { cache: "no-cache" })
        .then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then((catalog) => {
          status.textContent = `${catalog.extensions.length} extensions`;
          for (const entry of catalog.extensions) {
            const card = document.createElement("article");
            const titleRow = document.createElement("div");
            const heading = document.createElement("h2");
            const details = document.createElement("a");
            const description = document.createElement("p");
            const command = document.createElement("code");
            const facts = document.createElement("p");
            const metadata = document.createElement("p");
            const repository = document.createElement("a");

            titleRow.className = "title-row";
            heading.textContent = entry.extension_name;
            details.href = `extensions/${entry.extension_name}/`;
            details.textContent = "Details";
            description.textContent = entry.description;
            command.textContent = entry.installation.install_command;
            facts.className = "facts meta";
            const version = document.createElement("span");
            const stars = document.createElement("span");
            const python = document.createElement("span");
            version.textContent = entry.package.published
              ? `Version ${entry.package.latest_version}`
              : `Not published on ${entry.package.index}`;
            stars.textContent = `${entry.source.github_stars} GitHub stars`;
            python.textContent = entry.package.python_versions.length
              ? `Python ${entry.package.python_versions.join(", ")}`
              : entry.package.wheel_count
                ? `Wheel tags ${entry.package.python_tags.join(", ")}`
                : "No wheels published";
            facts.append(version, stars, python);
            metadata.className = "meta";
            repository.href = entry.repository;
            repository.textContent = `${entry.publisher} · ${entry.license}`;
            metadata.append(repository);
            titleRow.append(heading, details);
            card.append(titleRow, description, command, facts, metadata);
            extensions.append(card);
          }
        })
        .catch((error) => {
          status.textContent = `Catalog unavailable: ${error.message}`;
        });
    </script>
  </body>
</html>
