name: Registry CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install check-jsonschema==0.38.0
      - name: Validate manifests against the schema
        run: check-jsonschema --schemafile schema/extension.schema.json extensions/*/extension.json
      - name: Verify the generated catalog
        run: python -m scripts.build_catalog --check index.json
      - name: Run registry tests
        run: python -m unittest discover -s tests -v
