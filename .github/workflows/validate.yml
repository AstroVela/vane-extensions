name: Validate registry and installation recipes

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      python_versions: ${{ steps.targets.outputs.python_versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install registry tooling
        run: python -m pip install -r requirements.txt
      - name: Read the installation target matrix
        id: targets
        run: |
          python -c 'import json; from scripts.installation import PYTHON_TARGETS; print("python_versions=" + json.dumps(PYTHON_TARGETS))' >> "$GITHUB_OUTPUT"
      - name: Validate manifests against the schema
        run: check-jsonschema --schemafile schema/extension.schema.json extensions/*/extension.json
      - name: Verify the generated catalog
        run: python -m scripts.build_catalog --check index.json
      - name: Run registry tests
        run: python -m unittest discover -s tests -v
      - name: Assemble the site with live metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.build_site --output _site
      - name: Validate generated service documents
        run: |
          check-jsonschema --schemafile schema/extension-details-index.schema.json \
            _site/v1/extensions/index.json
          find _site/v1/extensions -maxdepth 1 -type f -name '*.json' \
            ! -name 'index.json' -print0 \
            | xargs -0 check-jsonschema \
                --schemafile schema/extension-detail.schema.json
          check-jsonschema --schemafile schema/download-metrics.schema.json \
            _site/v1/metrics/downloads-last-week.json
      - name: Preserve the exact site snapshot for installation checks and deployment
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: registry-site
          path: _site
          include-hidden-files: true
          if-no-files-found: error

  smoke:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.validate.outputs.python_versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: registry-site
          path: _site
      - name: Install exact wheels, check dependencies, and load each published provider
        run: python -m scripts.smoke_install --site _site
