name: Publish registry

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install registry tooling
        run: python -m pip install -r requirements.txt
      - name: Validate and test the registry
        run: |
          check-jsonschema --schemafile schema/extension.schema.json extensions/*/extension.json
          python -m scripts.build_catalog --check index.json
          python -m unittest discover -s tests -v
      - name: Assemble the site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.build_site --output _site
      - name: Validate generated service documents
        run: |
          check-jsonschema --schemafile schema/extension-details-index.schema.json \
            _site/v1/extensions/index.json
          find _site/v1/extensions -maxdepth 1 -type f -name '*.json' \
            ! -name 'index.json' -print0 \
            | xargs -0 check-jsonschema \
                --schemafile schema/extension-detail.schema.json
          check-jsonschema --schemafile schema/download-metrics.schema.json \
            _site/v1/metrics/downloads-last-week.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
